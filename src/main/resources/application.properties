# Spring Application
spring.application.name=loganalyzer-backend

# Server Configuration
server.port=8080

# Logging Configuration
# Logging - ANSI Colors for Debug Console
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}
logging.level.com.loganalyzer=DEBUG
logging.level.org.springframework.amqp=INFO

# ==========================================
# Database & Cache & Messaging Connections
# ==========================================

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/loganalyzer-db

# Redis Configuration
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

# RabbitMQ Configuration
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==========================================
# LLM (Large Language Model) Configuration
# ==========================================
llm.api-url=http://192.168.1.5:11434/api/generate
llm.model=qwen2.5:7b-instruct
llm.temperature=0.7
llm.max-tokens=1000

